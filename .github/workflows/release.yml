# main 에 push 될 때마다 (VERSION 이 네 자리면 테스트용 prerelease) VERSION 을 보고, 아직 없는 버전이면, 윈도우에서 LeuniTalk.exe 를 빌드해 깃허브 릴리스(v버전)에 자동 업로드
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 버전 읽기
        id: ver
        shell: bash
        run: |
          v=$(tr -d ' \r\n' < VERSION)
          echo "v=$v" >> "$GITHUB_OUTPUT"
          # 네 자리 버전(1.0.10.1 같은)은 테스트용: prerelease 로 올려서 일반 사용자 자동 업데이트에는 안 잡힘
          if [ "$(echo "$v" | tr -cd '.' | wc -c)" -ge 3 ]; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi
          if gh release view "v$v" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; else echo "exists=0" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-python@v5
        if: steps.ver.outputs.exists == '0'
        with:
          python-version: "3.12"
      - name: 버전 반영
        if: steps.ver.outputs.exists == '0'
        shell: python
        run: |
          import json, re
          v = open("VERSION", encoding="utf-8").read().strip()
          p = "app/app.py"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r'^VERSION = "[^"]*"', f'VERSION = "{v}"', s, flags=re.M)
          open(p, "w", encoding="utf-8").write(s)
          m = json.load(open("extension/manifest.json", encoding="utf-8"))
          m["version"] = v
          json.dump(m, open("extension/manifest.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          t = "addon/SoopBridge/SoopBridge.toc"
          s = open(t, encoding="utf-8").read()
          s = re.sub(r"^## Version: .*$", f"## Version: {v}", s, flags=re.M)
          open(t, "w", encoding="utf-8").write(s)
      - name: exe 빌드
        if: steps.ver.outputs.exists == '0'
        run: |
          python -m pip install --upgrade pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name LeuniTalk --icon assets/leuni.ico --add-data "assets/leuni.ico;." --add-data "addon;addon" --add-data "extension;extension" app/app.py
      - name: 릴리스 업로드
        if: steps.ver.outputs.exists == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: 르니톡 v${{ steps.ver.outputs.v }}
          files: dist/LeuniTalk.exe
          prerelease: ${{ steps.ver.outputs.pre == 'true' }}
          body_path: NOTES.md  # 프로그램 업데이트 창에 보이는 설명 (사용자용)
          generate_release_notes: true
